<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBX Arena preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #eef0f6; --surface: #ffffff; --ink: #16183a; --muted: #5c6080; --line: #d5d8e6;
  --signal: #2944f0; --sub: #c8176b; --win: #13795b; --loss: #b42318; --wave-rest: #9ea3c0;
  --on-ink: #eef0f6;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13152b; --surface: #1c1f3a; --ink: #e8e9f6; --muted: #9a9ec0; --line: #2e3256;
    --signal: #8ea0ff; --sub: #ff5ca6; --win: #4cc79a; --loss: #ff8a7a; --wave-rest: #4a4f78;
    --on-ink: #13152b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13152b; --surface: #1c1f3a; --ink: #e8e9f6; --muted: #9a9ec0; --line: #2e3256;
  --signal: #8ea0ff; --sub: #ff5ca6; --win: #4cc79a; --loss: #ff8a7a; --wave-rest: #4a4f78;
  --on-ink: #13152b;
  color-scheme: dark;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4rem); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
img, canvas { max-width: 100%; }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-weight: inherit; }

.handle { font-stretch: 125%; font-weight: 760; letter-spacing: -0.015em; }
.num { font-stretch: 78%; font-weight: 620; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.wrap { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }
.stack { display: grid; gap: 1rem; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 1.5rem; height: 3.75rem; }
.brand { font-stretch: 125%; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; white-space: nowrap; }
.brand span { color: var(--sub); }
.nav { display: flex; gap: 0.25rem; }
.nav button {
  border: 0; background: transparent; padding: 0.4rem 0.85rem; border-radius: 999px; color: var(--muted);
}
.nav button[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
.top .note { margin-left: auto; font-size: 0.8rem; color: var(--muted); text-align: right; }
@media (max-width: 640px) { .top .note { display: none; } .top .wrap { gap: 0.75rem; } }

#app { padding-top: 2rem; padding-bottom: 4rem; }

/* Buttons */
.btn { border: 0; border-radius: 999px; background: var(--ink); color: var(--on-ink); padding: 0.65rem 1.25rem; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-line { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 0.65rem 1.25rem; }

/* Battle selector */
.picker { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); margin-bottom: 2.5rem; }
.picker button {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 0.85rem 1rem;
  display: grid; gap: 0.15rem;
}
.picker button[aria-current="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.picker .who { font-stretch: 112%; font-weight: 700; overflow-wrap: anywhere; }
.tag { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; color: var(--muted); }
.dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--line); }
.dot.live { background: var(--sub); }
.dot.done { background: var(--win); }

/* Face-off */
.faceoff { display: grid; gap: 1rem; align-items: end; grid-template-columns: 1fr; }
@media (min-width: 768px) { .faceoff { grid-template-columns: 1fr auto 1fr; } .faceoff .right { text-align: right; justify-items: end; } }
.faceoff .side { display: grid; gap: 0.35rem; min-width: 0; }
.faceoff h2 { font-size: clamp(1.9rem, 5.2vw, 3.6rem); line-height: 0.95; overflow-wrap: anywhere; }
.faceoff .vs { font-stretch: 125%; font-weight: 700; color: var(--muted); font-size: 1.4rem; padding-bottom: 0.5rem; }
.badge { display: inline-block; border-radius: 999px; padding: 0.05rem 0.55rem; font-size: 0.8rem; background: var(--win); color: var(--on-ink); margin-left: 0.4rem; vertical-align: 0.1em; }
.up { color: var(--win); } .down { color: var(--loss); }
.statusbar {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1.5rem;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0.75rem 0; margin: 1.5rem 0 2rem;
}
.statusbar .main { font-size: 1.1rem; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.5rem; margin-bottom: 2rem; font-size: 0.9rem; }
.controls label { display: flex; align-items: center; gap: 0.5rem; }
.controls input[type="checkbox"] { width: 1rem; height: 1rem; accent-color: var(--signal); }
.legend { display: inline-flex; align-items: center; gap: 0.45rem; color: var(--muted); }
.legend i { display: inline-block; width: 4px; height: 0.9rem; border-radius: 2px; background: var(--sub); }

/* Rounds */
.round { display: grid; gap: 0.85rem; margin-bottom: 2.5rem; }
.round > h3 { font-size: 0.9rem; color: var(--muted); }
.pair { display: grid; gap: 1.75rem; grid-template-columns: 1fr; }
@media (min-width: 768px) { .pair { grid-template-columns: 1fr 1fr; gap: 2.5rem; } .span2 { grid-column: 1 / -1; } }
.cell { display: grid; gap: 0.5rem; min-width: 0; }
.cell .meta { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem; color: var(--muted); flex-wrap: wrap; }
.empty {
  display: grid; place-items: center; min-height: 7rem; padding: 1rem; text-align: center;
  border: 1px dashed var(--line); border-radius: 14px; color: var(--muted);
}

/* Player */
.player { display: flex; align-items: center; gap: 0.75rem; }
.play {
  flex: none; width: 3rem; height: 3rem; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--ink); color: var(--on-ink);
}
.play.sm { width: 2.25rem; height: 2.25rem; }
.play svg { width: 1rem; height: 1rem; }
.seek { flex: 1; min-width: 0; cursor: pointer; touch-action: none; border-radius: 4px; }
.seek canvas { display: block; width: 100%; height: 80px; }
.seek canvas.compact { height: 36px; }
.player .t { flex: none; font-size: 0.85rem; color: var(--muted); min-width: 3ch; text-align: right; }
.loading { display: flex; align-items: center; gap: 0.75rem; height: 80px; color: var(--muted); font-size: 0.9rem; }
.loading.compact { height: 36px; }
.loading::before {
  content: ""; flex: 1; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 3px);
}

/* Vote panel */
.panel { background: var(--surface); border-radius: 18px; padding: 1.25rem; display: grid; gap: 1.1rem; }
@media (min-width: 640px) { .panel { padding: 1.5rem; } }
.panel > h3 { font-size: 1.3rem; }
.votes { display: grid; gap: 0.75rem; grid-template-columns: 1fr; }
@media (min-width: 640px) { .votes { grid-template-columns: 1fr 1fr; } }
.vote {
  border: 2px solid var(--ink); background: transparent; border-radius: 14px; padding: 0.9rem 1rem; font-size: 1.05rem;
}
.vote:hover:not(:disabled) { background: var(--ink); color: var(--on-ink); }
.vote:disabled { border-color: var(--line); color: var(--muted); cursor: not-allowed; }
.tally { display: grid; gap: 0.4rem; }
.tally .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.15rem; }
.bar { display: flex; height: 0.75rem; border-radius: 999px; overflow: hidden; background: var(--line); }
.bar .a { background: var(--signal); transition: width 0.4s ease; }
.bar .b { flex: 1; background: var(--sub); }
.voters { display: grid; gap: 1rem; grid-template-columns: 1fr; font-size: 0.875rem; }
@media (min-width: 640px) { .voters { grid-template-columns: 1fr 1fr; } }
.tools {
  border: 1px dashed var(--line); border-radius: 14px; padding: 0.85rem 1rem; margin-top: 1.5rem;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; font-size: 0.9rem;
}

/* Recorder */
.rec { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.25rem; display: grid; gap: 1.25rem; }
.tabs { display: inline-flex; gap: 0.25rem; padding: 0.25rem; background: var(--paper); border-radius: 999px; justify-self: start; }
.tabs button { border: 0; background: transparent; border-radius: 999px; padding: 0.35rem 0.9rem; font-size: 0.9rem; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--on-ink); }
.meters { display: grid; gap: 0.5rem; }
.meter { display: grid; grid-template-columns: 10rem 1fr; gap: 0.75rem; align-items: center; font-size: 0.875rem; }
.meter .track { height: 0.5rem; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter .fill { height: 100%; transform-origin: left; transform: scaleX(0); border-radius: 999px; }
.fill.full { background: var(--signal); } .fill.sub { background: var(--sub); }
.clip { font-size: 0.875rem; color: var(--loss); min-height: 1.3em; }
.recrow { display: flex; flex-wrap: wrap; align-items: center; gap: 1.25rem; }
.recbtn { width: 4rem; height: 4rem; border-radius: 50%; display: grid; place-items: center; background: transparent; border: 4px solid var(--ink); }
.recbtn span { width: 2rem; height: 2rem; border-radius: 50%; background: var(--sub); }
.recbtn.stop { border-color: var(--sub); }
.recbtn.stop span { width: 1.25rem; height: 1.25rem; border-radius: 3px; }
.clock { font-size: 1.6rem; }
.prog { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; }
.prog div { height: 100%; width: 0; background: var(--ink); }
.warn { border: 1px solid color-mix(in srgb, var(--sub) 40%, transparent); background: color-mix(in srgb, var(--sub) 6%, transparent); border-radius: 10px; padding: 0.75rem; font-size: 0.875rem; display: grid; gap: 0.3rem; }
.drop {
  display: grid; place-items: center; gap: 0.4rem; text-align: center; padding: 2.5rem 1.5rem;
  border: 2px dashed var(--line); border-radius: 14px; cursor: pointer;
}
.drop:focus-within { outline: 2px solid var(--signal); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem 1.5rem; font-size: 0.875rem; }
@media (min-width: 640px) { .specs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.specs dt { color: var(--muted); } .specs dd { margin: 0; }
.err { color: var(--loss); }
.row-btns { display: flex; flex-wrap: wrap; gap: 0.75rem; }

/* Directory */
.dirhead h1 { font-stretch: 125%; font-weight: 800; letter-spacing: -0.02em; font-size: clamp(2.5rem, 7vw, 4.5rem); line-height: 1; }
.filters { display: grid; gap: 0.75rem; margin: 1.75rem 0; grid-template-columns: 1fr; }
@media (min-width: 720px) { .filters { grid-template-columns: 2fr 1fr 1fr; } }
.filters label { display: grid; gap: 0.25rem; font-size: 0.85rem; color: var(--muted); }
.filters input, .filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0.55rem 0.75rem; color: var(--ink); }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); list-style: none; padding: 0; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.15rem; display: grid; gap: 1.1rem; align-content: start; height: 100%; }
.card header { display: flex; gap: 0.9rem; align-items: flex-start; }
.avatar { flex: none; width: 3.25rem; height: 3.25rem; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); font-stretch: 125%; font-weight: 800; font-size: 1.2rem; }
.card .id { min-width: 0; flex: 1; }
.card h3 { font-size: 1.2rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .elo { text-align: right; }
.card .elo .num { font-size: 1.9rem; line-height: 1; }
.record { display: flex; gap: 1rem; font-size: 0.875rem; }
.record .rate { margin-left: auto; color: var(--muted); }
.winbar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.winbar div { height: 100%; background: var(--win); }
.plink {
  background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; color: inherit; text-align: inherit;
  text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 0.15em; text-decoration-thickness: 0.06em;
}
.plink:hover { text-decoration-color: currentColor; }
.form { display: flex; gap: 0.25rem; list-style: none; margin: 0; padding: 0; }
.form li { width: 1.5rem; height: 1.5rem; border-radius: 6px; display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; color: var(--on-ink); }
.f-W { background: var(--win); } .f-L { background: var(--loss); } .f-D { background: var(--muted); }
.cardrow { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.card .btn-line { justify-self: start; padding: 0.5rem 1rem; font-size: 0.9rem; }

/* Profile */
.back { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 0.4rem 0.9rem; font-size: 0.9rem; }
.phead { display: flex; gap: 1.25rem; align-items: center; margin: 1.5rem 0 2rem; }
.avatar.lg { width: 5rem; height: 5rem; font-size: 2rem; }
.phead h1 { font-size: clamp(2rem, 6vw, 4rem); line-height: 1; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; margin-top: 0.6rem; color: var(--muted); }
.statgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0 0 2.75rem; border-top: 2px solid var(--ink); }
@media (min-width: 720px) { .statgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.statgrid > div { padding: 0.9rem 1rem 1rem 0; border-bottom: 1px solid var(--line); min-width: 0; }
.statgrid dt { font-size: 0.85rem; color: var(--muted); }
.statgrid dd { margin: 0.15rem 0 0; font-size: 2rem; line-height: 1.1; overflow-wrap: anywhere; }
.statgrid dd.text { font-size: 1.15rem; font-stretch: 100%; font-weight: 650; padding: 0.35rem 0 0.25rem; }
.statgrid .note { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
.psec { display: grid; gap: 1rem; margin-bottom: 2.75rem; }
.psec > h2 { font-size: 1.35rem; font-stretch: 112%; font-weight: 700; }
.chartwrap { display: grid; grid-template-columns: auto 1fr; gap: 0.35rem 0.75rem; }
.ylab { display: flex; flex-direction: column; justify-content: space-between; font-size: 0.8rem; color: var(--muted); text-align: right; }
.xlab { grid-column: 2; display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
.chart { display: block; width: 100%; height: 11rem; border-bottom: 1px solid var(--line); }
.chart .line { fill: none; stroke: var(--signal); stroke-width: 2; stroke-linejoin: round; }
.chart .area { fill: color-mix(in srgb, var(--signal) 10%, transparent); }
.chart .peak { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
.tablewrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.925rem; min-width: 34rem; }
.data th { text-align: left; font-weight: 600; color: var(--muted); font-size: 0.8rem; padding: 0.5rem 0.75rem 0.5rem 0; border-bottom: 2px solid var(--ink); }
.data td { padding: 0.6rem 0.75rem 0.6rem 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
.data .n { text-align: right; font-variant-numeric: tabular-nums; }
.data td:last-child { white-space: nowrap; }
.inprog { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.85rem 1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }

/* Live + create */
.picker .new { border-style: dashed; background: transparent; }
.livechip { font-size: 0.7rem; font-weight: 700; color: var(--on-ink); background: var(--sub); border-radius: 4px; padding: 0 0.35rem; }
.onair { display: inline-flex; align-items: center; gap: 0.45rem; font-weight: 650; }
.onair i { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--muted); }
.onair.on { color: var(--sub); }
.onair.on i { background: var(--sub); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.stage { display: grid; gap: 0.75rem; justify-items: start; padding: 0.5rem 0 2.75rem; }
.stage-k { font-size: 1.1rem; color: var(--muted); }
.bigclock { font-size: clamp(5rem, 19vw, 11rem); line-height: 0.85; font-stretch: 70%; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
.stage-sub { max-width: 54ch; font-size: 1.05rem; }
.btn-lg { padding: 0.9rem 1.6rem; font-size: 1.1rem; }
.joined { font-size: 1.05rem; padding-top: 0.6rem; border-top: 2px solid var(--sub); }
.nowname { font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1; overflow-wrap: anywhere; }
.nowwave { display: block; width: 100%; height: 96px; }
.lineup { list-style: none; margin: 0; padding: 0; counter-reset: run; }
.lineup li { counter-increment: run; display: grid; grid-template-columns: 1.75rem 1fr auto; gap: 0.75rem; align-items: baseline; padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
.lineup li::before { content: counter(run); color: var(--muted); font-variant-numeric: tabular-nums; }
.create { display: grid; gap: 1.75rem; max-width: 46rem; }
.create h1 { font-stretch: 125%; font-weight: 800; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1; letter-spacing: -0.02em; }
.modes { display: grid; gap: 0.75rem; grid-template-columns: 1fr; }
@media (min-width: 640px) { .modes { grid-template-columns: 1fr 1fr; } }
.modes > div { display: grid; }
.modes label { display: grid; gap: 0.35rem; align-content: start; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; }
.modes input:checked + label { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.modes input:focus-visible + label, .segopts input:focus-visible + label { outline: 2px solid var(--signal); outline-offset: 3px; }
.modes .mt { font-weight: 700; font-stretch: 112%; font-size: 1.1rem; }
.seg { border: 0; padding: 0; margin: 0; display: grid; gap: 0.5rem; min-width: 0; }
.seg legend, .field > span { font-size: 0.9rem; color: var(--muted); padding: 0; margin-bottom: 0.5rem; }
.segopts { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.segopts label { display: block; padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--surface); }
.segopts input:checked + label { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.field { display: grid; gap: 0.15rem; }
.field select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0.6rem 0.75rem; max-width: 22rem; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">BBX&nbsp;Arena<span>.</span></div>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-view="battles">Battles</button>
      <button type="button" data-view="directory">Beatboxers</button>
    </nav>
    <p class="note">Preview with sample data. Nothing is saved.</p>
  </div>
</header>
<main id="app" class="wrap"></main>

<script>
'use strict';

/* ============================================================
   Small DOM + format helpers
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const history = [];
function recordResult(rec) {

  A.peak = Math.max(A.peak, A.elo); B.peak = Math.max(B.peak, B.elo);

  rec.eloA = A.elo; rec.eloB = B.elo;
  rec.winner = rec.score === 1 ? rec.a : rec.score === 0 ? rec.b : null;
  history.push(rec);
  return rec;
}

(function seedHistory() {
  const rnd = mulberry32(611);
  const pool = profiles.filter((p) => p.activity > 0);
  const pick = (not) => {
    const c = pool.filter((p) => p !== not);
    let r = rnd() * c.reduce((s, p) => s + p.activity, 0);
    for (const p of c) { r -= p.activity; if (r <= 0) return p; }
    return c[c.length - 1];
  };
  const N = 190, span = 520 * DAY, start = Date.now() - span - 4 * DAY;
  for (let i = 0; i < N; i++) {
    const A = pick(null), B = pick(A);
    const aWins = rnd() < 1 / (1 + Math.pow(10, (B.skill - A.skill) / 400));
    const r = rnd();
    const rec = { id: `h${i}`, date: start + (i / N) * span + rnd() * DAY * 0.8, a: A.u, b: B.u };
    if (r < 0.05) { rec.result = 'forfeit'; rec.forfeitBy = aWins ? B.u : A.u; rec.score = aWins ? 1 : 0; }
    else if (r < 0.09) { const n = 3 + Math.floor(rnd() * 9); rec.result = 'draw'; rec.votesA = rec.votesB = n; rec.score = 0.5; }
    else {

        const ready = sub.take ? Promise.resolve(sub.take) : getClip(sub.key, 20, p.snd);

      else if (myVote) votePanel.append(h('p', {}, `You voted for @${myVote.for}.`));
      else {
        const heardAll = b.subs.every((s) => (state.listened[s.key] || 0) >= 0.5);
        votePanel.append(h('div', { class: 'votes' }, [b.a, b.b].map((u) =>
          h('button', { type: 'button', class: 'vote', disabled: !heardAll, onclick: () => { b.votes.push({ voter: ME, for: u }); paintVotes(); heardLabels.forEach((_, k) => paintHeard(k)); } },
            'Vote for ', h('span', { class: 'handle' }, `@${u}`)))));

/* ============================================================
   Recorder: voice processing off, raw PCM, WAV, live meters
   ============================================================ */
const WORKLET = `
class BbxRecorder extends AudioWorkletProcessor {
  constructor() { super(); this.batch = 4096; this.rec = false; this.bufs = null; this.filled = 0;
    this.port.onmessage = (e) => {
      if (e.data.type === 'start') { this.rec = true; this.bufs = null; this.filled = 0; }
      else if (e.data.type === 'stop') { this.flush(); this.rec = false; this.port.postMessage({ type: 'stopped' }); }
    };
  }
  flush() { if (!this.bufs || !this.filled) return; const c = this.bufs.map((b) => b.slice(0, this.filled));
    this.port.postMessage({ type: 'chunk', chans: c }, c.map((x) => x.buffer)); this.bufs = null; this.filled = 0; }
  process(inputs) { const inp = inputs[0]; if (!this.rec || !inp || !inp.length) return true;
    if (!this.bufs) this.bufs = inp.map(() => new Float32Array(this.batch));
    const n = inp[0].length; for (let c = 0; c < this.bufs.length; c++) this.bufs[c].set(inp[c] || inp[0], this.filled);
    this.filled += n; if (this.filled + n > this.batch) this.flush(); return true; }
}
registerProcessor('bbx-recorder', BbxRecorder);`;

async function makeCapture(ctx, src, ch, onChunk) {
  const sink = new GainNode(ctx, { gain: 0 }); sink.connect(ctx.destination);
  try {
    const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
    try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
    let waiter = null;
    const node = new AudioWorkletNode(ctx, 'bbx-recorder', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1], channelCount: ch, channelCountMode: 'explicit', channelInterpretation: 'discrete' });
    node.port.onmessage = (e) => { if (e.data.type === 'chunk') onChunk(e.data.chans); else if (e.data.type === 'stopped' && waiter) { waiter(); waiter = null; } };
    src.connect(node); node.connect(sink);
    return { start: () => node.port.postMessage({ type: 'start' }), stop: () => new Promise((r) => { waiter = r; node.port.postMessage({ type: 'stop' }); }) };
  } catch (e) {
    // Fallback where worklet modules can't load: still raw PCM, just on the main thread.
    const sp = ctx.createScriptProcessor(4096, ch, 1); let rec = false;
    sp.onaudioprocess = (ev) => { if (!rec) return; const c = []; for (let i = 0; i < ch; i++) c.push(new Float32Array(ev.inputBuffer.getChannelData(i))); onChunk(c); };
    src.connect(sp); sp.connect(sink);
    return { start: () => { rec = true; }, stop: () => { rec = false; return Promise.resolve(); } };
  }
}

function micError(err) {
  const n = err && err.name;
  if (n === 'NotAllowedError' || n === 'SecurityError')
    return 'Microphone access is blocked. If this preview is showing inside another page, open it in its own tab, or switch to Upload a file.';
  if (n === 'NotFoundError') return 'No microphone was found. Plug one in and try again.';
  if (n === 'NotReadableError') return 'Another app is using the microphone. Close it and try again.';
  if (n === 'Unsupported') return 'This browser can’t record here. Switch to Upload a file.';
  return 'The microphone couldn’t start. Try again, or switch to Upload a file.';
}

function makeRecorder({ maxSeconds, onSubmit, scope, submitLabel }) {
  const root = h('div', { class: 'rec' });
  const S = { mode: 'record', status: 'idle', error: null, warnings: [], take: null, upTake: null, upBusy: false, upErr: null, countdown: null, submitting: false, subErr: null };
  let stream = null, actx = null, cap = null, aFull = null, aSub = null, chunks = [], frames = 0, meterRaf = 0, timer = 0, cdTimer = 0, takePlayer = null, clipUntil = 0;
  let refs = {};

  function releaseMic() {
    cancelAnimationFrame(meterRaf); clearInterval(timer); clearTimeout(cdTimer);
    if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null;
    if (actx) actx.close().catch(() => {}); actx = null; cap = null; aFull = aSub = null;
  }
  scope.add(() => { releaseMic(); if (takePlayer) takePlayer.destroy(); });

  async function prepare() {
    S.status = 'requesting'; S.error = null; render();
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error(), { name: 'Unsupported' });
      stream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: false, noiseSuppression: false, autoGainControl: false, voiceIsolation: false,
        channelCount: { ideal: 1 }, sampleRate: { ideal: 48000 }, sampleSize: { ideal: 24 } } });
      const track = stream.getAudioTracks()[0], s = track.getSettings(), w = [];
      if (s.noiseSuppression) w.push('Your browser kept noise suppression on. It strips sustained bass; Chrome or Firefox on desktop usually let us turn it off.');
      if (s.autoGainControl) w.push('Your browser kept automatic gain on. Expect the volume to duck after heavy bass hits.');
      if (s.echoCancellation) w.push('Echo cancellation is still on. Headphones reduce how much it interferes.');
      if (/hands-?free|headset|airpods|bluetooth/i.test(track.label)) w.push('This looks like a Bluetooth headset mic. Bluetooth call audio drops almost all low end; use a wired or USB mic.');
      S.warnings = w;
      actx = new AudioContext(s.sampleRate ? { sampleRate: s.sampleRate } : {});
      const src = actx.createMediaStreamSource(stream);
      cap = await makeCapture(actx, src, Math.min(2, Math.max(1, s.channelCount || 1)), onChunk);
      aFull = new AnalyserNode(actx, { fftSize: 2048 }); aSub = new AnalyserNode(actx, { fftSize: 4096 });
      src.connect(aFull);
      src.connect(new BiquadFilterNode(actx, { type: 'lowpass', frequency: SUB_HZ, Q: Math.SQRT1_2 }))
        .connect(new BiquadFilterNode(actx, { type: 'lowpass', frequency: SUB_HZ, Q: Math.SQRT1_2 })).connect(aSub);
      S.status = 'ready'; render(); meters();

    chunks.push(c); frames += c[0].length;

  }

    cancelAnimationFrame(meterRaf);
    const buf = new Float32Array(4096);
    const loop = () => {
      if (!aFull || !aSub) return;
      const a = buf.subarray(0, aFull.fftSize); aFull.getFloatTimeDomainData(a);
      let s = 0, pk = 0; for (let i = 0; i < a.length; i++) { s += a[i] * a[i]; pk = Math.max(pk, Math.abs(a[i])); }
      const b2 = buf.subarray(0, aSub.fftSize); aSub.getFloatTimeDomainData(b2);
      let ss = 0; for (let i = 0; i < b2.length; i++) ss += b2[i] * b2[i];
      const db = (x) => (x > 0 ? 20 * Math.log10(x) : -Infinity), frac = (d) => Math.max(0, Math.min(1, (d + 66) / 60));
      if (refs.full) refs.full.style.transform = `scaleX(${frac(db(Math.sqrt(s / a.length)))})`;
      if (refs.sub) refs.sub.style.transform = `scaleX(${frac(db(Math.sqrt(ss / b2.length)))})`;
      const now = performance.now(); if (pk > 0.966) clipUntil = now + 1500;
      if (refs.clip) refs.clip.style.visibility = now < clipUntil ? 'visible' : 'hidden';
      meterRaf = requestAnimationFrame(loop);
    };
    meterRaf = requestAnimationFrame(loop);
  }

  function countdown(n) {

    if (refs.prog) refs.prog.style.width = `${Math.min(1, el / maxSeconds) * 100}%`;

      const total = Math.min(max, chunks.reduce((n, c) => n + c[0].length, 0));

    const tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'How to add your round' },
      [['record', 'Record'], ['upload', 'Upload a file']].map(([m, t]) =>
        h('button', { type: 'button', role: 'tab', 'aria-selected': String(S.mode === m), onclick: () => { S.mode = m; render(); } }, t)));
    root.append(tabs);
    const take = S.mode === 'record' ? S.take : S.upTake;

    if (S.mode === 'record' && !take) {
      if (['idle', 'error', 'requesting'].includes(S.status)) {
        root.append(h('p', { class: 'muted', style: 'max-width:62ch' }, 'Your browser’s voice filters get switched off so your low end is recorded as it is. Use headphones if you’ll play a beat while recording.'),
          h('button', { type: 'button', class: 'btn', style: 'justify-self:start', disabled: S.status === 'requesting', onclick: prepare }, S.status === 'requesting' ? 'Waiting for permission…' : 'Turn on microphone'));
      }
      if (S.status === 'ready' || S.status === 'recording') {
        refs.full = h('div', { class: 'fill full' }); refs.sub = h('div', { class: 'fill sub' });
        refs.clip = h('p', { class: 'clip', style: 'visibility:hidden', role: 'status' }, 'Clipping. Move back from the mic or turn your interface gain down.');
        root.append(h('div', { class: 'meters' },
          h('div', { class: 'meter' }, h('span', { class: 'muted' }, 'Input level'), h('div', { class: 'track', 'aria-hidden': 'true' }, refs.full)),
          h('div', { class: 'meter' }, h('span', { class: 'muted' }, 'Sub-bass, below 100 Hz'), h('div', { class: 'track', 'aria-hidden': 'true' }, refs.sub)),
          refs.clip));
        if (S.warnings.length) root.append(h('div', { class: 'warn' }, S.warnings.map((w) => h('p', {}, w))));
        refs.clock = h('p', { class: 'num clock', 'aria-live': 'polite' });
        refs.prog = h('div');
        const recording = S.status === 'recording';
        root.append(h('div', { class: 'recrow' },
          h('button', { type: 'button', class: 'recbtn' + (recording ? ' stop' : ''), 'aria-label': recording ? 'Stop recording' : 'Start recording', disabled: S.countdown != null,
            onclick: () => (recording ? stop() : countdown(3)) }, h('span')),
          h('div', { style: 'flex:1;min-width:12rem;display:grid;gap:.4rem' }, refs.clock, h('div', { class: 'prog', 'aria-hidden': 'true' }, refs.prog),
            h('p', { class: 'small muted' }, `Recording stops by itself at ${maxSeconds} seconds.`))));
        paintClock();
      }
      if (S.status === 'processing') root.append(h('p', { role: 'status' }, 'Preparing your take…'));
      if (S.error) root.append(h('p', { class: 'err', role: 'alert' }, S.error));
    }

    if (S.mode === 'upload' && !take) {
      const input = h('input', { type: 'file', accept: '.wav,.flac,.mp3,.m4a,.aac', class: 'sr', onchange: (e) => handleFile(e.target.files[0]) });
      root.append(h('label', { class: 'drop' }, h('span', { style: 'font-size:1.1rem' }, 'Choose an audio file'),
        h('span', { class: 'small muted', style: 'max-width:56ch' }, `WAV or FLAC keeps every bit of your bass. MP3 and M4A work too, but anything their encoder already removed can’t come back. Up to ${maxSeconds} seconds.`), input));
      if (S.upBusy) root.append(h('p', { role: 'status' }, 'Reading your file…'));
      if (S.upErr) root.append(h('p', { class: 'err', role: 'alert' }, S.upErr));
    }

    if (take) {
      takePlayer = wavePlayer({ src: take.url, analysis: take.analysis, label: 'your take' });
      const a = take.analysis;
      root.append(takePlayer.el,
        h('dl', { class: 'specs' },
          h('div', {}, h('dt', {}, 'Length'), h('dd', { class: 'num' }, fmtTime(a.durationMs / 1000))),
          h('div', {}, h('dt', {}, 'Format'), h('dd', {}, `${take.format}, ${take.channels === 2 ? 'stereo' : 'mono'}`)),
          h('div', {}, h('dt', {}, 'Sub-bass share'), h('dd', { class: 'num', style: 'color:var(--sub)' }, `${Math.round(a.subRatio * 100)}%`)),
          h('div', {}, h('dt', {}, 'Loudness / peak'), h('dd', { class: 'num' }, `${fmtDb(a.lufs, 'LUFS')} / ${fmtDb(a.peakDb, 'dBFS')}`))));
      if (!take.lossless) root.append(h('p', { class: 'small muted' }, 'This is a compressed file. It will be stored exactly as uploaded, with no second round of compression.'));
      if (S.subErr) root.append(h('p', { class: 'err', role: 'alert' }, S.subErr));
      root.append(h('div', { class: 'row-btns' },
        h('button', { type: 'button', class: 'btn', disabled: S.submitting, onclick: async () => {
          S.submitting = true; render();
          try { await onSubmit(take); } catch (err) { S.subErr = 'The round wasn’t submitted. Try again.'; S.submitting = false; render(); }
        } }, S.submitting ? 'Submitting…' : submitLabel),
        h('button', { type: 'button', class: 'btn-line', disabled: S.submitting, onclick: () => {
          if (S.mode === 'record') { S.take = null; S.status = actx ? 'ready' : 'idle'; } else S.upTake = null; render();
        } }, S.mode === 'record' ? 'Record again' : 'Choose another file')));
    }
  }
  render();
  return root;
}

/* ============================================================
   Stats helpers
   ============================================================ */
function statsOf(u) {
  return history.filter((r) => r.a === u || r.b === u).map((r) => {
    const isA = r.a === u;
    return {
      r, opp: isA ? r.b : r.a, delta: isA ? r.dA : r.dB, elo: isA ? r.eloA : r.eloB,
      mine: isA ? r.votesA : r.votesB, theirs: isA ? r.votesB : r.votesA,
      outcome: r.result === 'draw' ? 'D' : r.winner === u ? 'W' : 'L',
    };
  });
}
const listedProfiles = () => profiles.filter((p) => p.u !== ME || battlesOf(p) > 0);
function ranks() { return new Map([...listedProfiles()].sort((a, b) => b.elo - a.elo).map((p, i) => [p.u, i + 1])); }
function fmtAgo(ts) {
  const d = Math.floor((Date.now() - ts) / DAY);
  if (d < 1) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return `${d} days ago`;
  const m = Math.round(d / 30.4); if (m < 12) return m === 1 ? 'a month ago' : `${m} months ago`;
  const y = Math.round(d / 365); return y === 1 ? 'a year ago' : `${y} years ago`;
}
const fmtDate = (ts) => new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtMonth = (ts) => new Date(ts).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
const OUTCOME_WORD = { W: 'Won', L: 'Lost', D: 'Drew' };
function resultText(g) {
  if (g.r.result === 'forfeit') return g.outcome === 'W' ? 'Won by forfeit' : 'Lost by forfeit';
  return g.outcome === 'D' ? 'Draw' : `${OUTCOME_WORD[g.outcome]} by decision`;
}
function formStrip(games, n = 5) {
  const recent = games.slice(-n).reverse();
  return h('ol', { class: 'form', 'aria-label': `Last ${recent.length} results, newest first: ${recent.map((g) => OUTCOME_WORD[g.outcome].toLowerCase()).join(', ')}` },
    recent.map((g) => h('li', { class: 'f-' + g.outcome, title: `${resultText(g)} against @${g.opp}`, 'aria-hidden': 'true' }, g.outcome)));
}
function streakOf(games) {
  if (!games.length) return null;
  const kind = games[games.length - 1].outcome; let n = 0;
  for (let i = games.length - 1; i >= 0 && games[i].outcome === kind; i--) n++;
  const word = kind === 'W' ? (n === 1 ? 'win' : 'wins') : kind === 'L' ? (n === 1 ? 'loss' : 'losses') : (n === 1 ? 'draw' : 'draws');
  return `${n} ${word}`;
}
function lastBattleLine(g) {
  const verb = g.outcome === 'W' ? 'Beat' : g.outcome === 'L' ? 'Lost to' : 'Drew with';
  const score = g.r.result === 'forfeit' ? 'by forfeit' : `${g.mine}–${g.theirs}`;
  return h('p', { class: 'small' }, h('span', { class: 'muted' }, 'Last battle: '), `${verb} @${g.opp}, ${score}, ${fmtAgo(g.r.date)}`);
}
const avatar = (p, cls = '') => h('span', { class: 'avatar ' + cls, 'aria-hidden': 'true' }, p.u[0].toUpperCase());

/* ============================================================
   Directory
   ============================================================ */
function card(p, rank) {
  const games = statsOf(p.u), n = battlesOf(p), rate = n ? Math.round((p.w / n) * 100) : null, provisional = n < 20;
  const last = games[games.length - 1];
  return h('article', { class: 'card' },
    h('header', {},
      avatar(p),
      h('div', { class: 'id' },
        h('h3', { class: 'handle' }, profileLink(p.u)),
        h('p', { class: 'muted' }, p.name),
        p.c ? h('p', { class: 'small muted' }, h('span', { 'aria-hidden': 'true' }, flag(p.c) + ' '), countryName(p.c)) : null),
      h('div', { class: 'elo' }, h('p', { class: 'num' }, p.elo), h('p', { class: 'small muted', style: 'margin-top:.25rem' }, provisional ? 'Provisional' : `Rank ${rank}`))),
    h('div', { style: 'display:grid;gap:.45rem' },
      h('p', { class: 'record num' },
        h('span', {}, h('span', { class: 'up' }, p.w), ' won'), h('span', {}, h('span', { class: 'down' }, p.l), ' lost'),
        p.d ? h('span', {}, `${p.d} drawn`) : null, rate != null ? h('span', { class: 'rate' }, `${rate}% win rate`) : null),
      rate != null ? h('div', { class: 'winbar', 'aria-hidden': 'true' }, h('div', { style: `width:${rate}%` })) : null),
    games.length ? h('div', { class: 'cardrow' }, h('span', { class: 'small muted' }, 'Recent form'), formStrip(games)) : null,
    last ? lastBattleLine(last) : h('p', { class: 'small muted' }, 'No finished battles yet.'),
    h('button', { type: 'button', class: 'btn-line', onclick: () => go('profile', { profile: p.u }) }, 'See stats and battles'));
}

function viewDirectory(scope) {
  const f = state.filters;
  const countries = [...new Set(listedProfiles().map((p) => p.c).filter(Boolean))].sort((a, b) => countryName(a).localeCompare(countryName(b)));
  const count = h('p', { class: 'muted' });
  const grid = h('ul', { class: 'grid' });
  const winRate = (p) => (battlesOf(p) ? p.w / battlesOf(p) : -1);
  const SORTS = {
    rating: (a, b) => b.elo - a.elo,
    battles: (a, b) => battlesOf(b) - battlesOf(a),
    winrate: (a, b) => winRate(b) - winRate(a),
    name: (a, b) => a.u.localeCompare(b.u),
  };

  function paint() {
    grid.innerHTML = '';
    const rankOf = ranks(), q = f.q.trim().toLowerCase();
    const rows = listedProfiles()
      .filter((p) => (!q || p.u.includes(q) || p.name.toLowerCase().includes(q)) && (!f.country || p.c === f.country))
      .sort(SORTS[f.sort] || SORTS.rating);
    count.textContent = `${rows.length} ${rows.length === 1 ? 'artist' : 'artists'}${q || f.country ? ' match your filters' : ' on the board'}`;
    if (!rows.length) {
      grid.append(h('li', { class: 'empty', style: 'grid-column:1/-1' }, h('span', {}, 'No beatboxers match these filters. ',
        h('button', { type: 'button', class: 'btn-line', style: 'margin-left:.5rem', onclick: () => { Object.assign(f, { q: '', country: '' }); renderMain(); } }, 'Clear filters'))));
      return;
    }
    rows.forEach((p) => grid.append(h('li', {}, card(p, rankOf.get(p.u)))));
  }

  const sel = (key, options) => {
    const s = h('select', { onchange: (e) => { f[key] = e.target.value; paint(); } }, options.map(([v, t]) => h('option', { value: v }, t)));
    s.value = f[key]; return s;
  };
  const root = h('div', {},
    h('header', { class: 'dirhead stack', style: 'gap:.5rem' }, h('h1', {}, 'Beatboxers'), count),
    h('div', { class: 'filters', role: 'search' },
      h('label', {}, 'Name or handle', h('input', { type: 'search', placeholder: 'Search', value: f.q, oninput: (e) => { f.q = e.target.value; paint(); } })),
      h('label', {}, 'Country', sel('country', [['', 'Anywhere'], ...countries.map((c) => [c, countryName(c)])])),
      h('label', {}, 'Sort by', sel('sort', [['rating', 'Highest rated'], ['battles', 'Most battles'], ['winrate', 'Best win rate'], ['name', 'Handle A to Z']]))),
    grid);
  paint();
  return root;
}

/* ============================================================
   Profile
   ============================================================ */
function ratingChart(p, games) {
  const vals = [1200, ...games.map((g) => g.elo)];
  const min = Math.min(...vals), max = Math.max(...vals), pad = Math.max(12, (max - min) * 0.08), lo = min - pad, hi = max + pad;
  const W = 600, H = 160, x = (i) => (i / (vals.length - 1)) * W, y = (v) => H - ((v - lo) / (hi - lo)) * H;
  const line = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="Rating went from 1200 to ${p.elo} over ${games.length} battles, peaking at ${p.peak}">
    <path class="area" d="${line}L${W},${H}L0,${H}Z"/>
    <line class="peak" x1="0" x2="${W}" y1="${y(p.peak).toFixed(1)}" y2="${y(p.peak).toFixed(1)}" vector-effect="non-scaling-stroke"/>
    <path class="line" d="${line}" vector-effect="non-scaling-stroke"/></svg>`;
  return h('div', { class: 'chartwrap' },
    h('div', { class: 'ylab num', 'aria-hidden': 'true' }, h('span', {}, max), h('span', {}, min)),
    h('div', { html: svg }),
    h('div', { class: 'xlab', 'aria-hidden': 'true' }, h('span', {}, fmtDate(games[0].r.date)), h('span', {}, 'Latest battle')));
}

function viewProfile(p) {
  if (!p) return h('p', {}, 'This beatboxer doesn’t exist.');
  const games = statsOf(p.u), n = battlesOf(p), rate = n ? Math.round((p.w / n) * 100) : null;
  const rankOf = ranks(), provisional = n < 20;

  // Head-to-head
  const opp = new Map();
  for (const g of games) {
    const o = opp.get(g.opp) || { u: g.opp, n: 0, W: 0, L: 0, D: 0, last: null };
    o.n++; o[g.outcome]++; o.last = g; opp.set(g.opp, o);
  }
  const opponents = [...opp.values()].sort((a, b) => b.n - a.n || b.last.r.date - a.last.r.date);
  const top = opponents[0];

  const root = h('article', { class: 'profile', 'aria-label': `@${p.u} profile` },
    h('button', { type: 'button', class: 'back', onclick: () => go('directory') }, 'Back to all beatboxers'),
    h('header', { class: 'phead' },
      avatar(p, 'lg'),
      h('div', { style: 'min-width:0' },
        h('h1', { class: 'handle' }, `@${p.u}`),
        h('p', { class: 'facts' },
          h('span', {}, p.name),
          p.c ? h('span', {}, h('span', { 'aria-hidden': 'true' }, flag(p.c) + ' '), countryName(p.c)) : null,
          h('span', {}, `Joined ${fmtMonth(p.joined)}`)))));

  const tiles = [
    ['Rating', p.elo, 'num', provisional ? 'Provisional until 20 battles' : `Rank ${rankOf.get(p.u)} of ${rankOf.size}`],
    ['Peak rating', p.peak, 'num', p.peak === p.elo && n ? 'Currently at peak' : null],
    ['Battles', n, 'num', null],
    ['Won, lost, drawn', `${p.w}–${p.l}–${p.d}`, 'num', null],
    ['Win rate', rate != null ? `${rate}%` : '—', 'num', null],
    ['Current streak', streakOf(games) || '—', 'text', null],
    ['Forfeits', p.forfeits, 'num', 'Missed response windows'],
    ['Most faced', top ? `@${top.u}` : '—', 'text', top ? `${top.n} ${top.n === 1 ? 'battle' : 'battles'}, ${top.W}–${top.L}–${top.D}` : null],
  ];
  root.append(h('dl', { class: 'statgrid' }, tiles.map(([label, value, kind, note]) =>
    h('div', {}, h('dt', {}, label), h('dd', { class: kind }, value), note ? h('p', { class: 'note' }, note) : null))));

  const live = battles.filter((b) => (b.a === p.u || b.b === p.u) && ['active', 'voting', 'scheduled', 'live'].includes(b.status));
  if (live.length) {
    root.append(h('section', { class: 'psec' }, h('h2', {}, 'In progress'),
      live.map((b) => {
        const other = b.a === p.u ? b.b : b.a;
        const what = b.status === 'scheduled' ? 'Live battle, starting soon' : b.status === 'live' ? 'Live now' : b.status === 'voting' ? 'Voting open' : b.turn === p.u ? `@${p.u}’s turn` : `@${other}’s turn`;
        return h('div', { class: 'inprog' }, h('p', {}, `Against @${other}`, h('span', { class: 'muted' }, `. ${what}.`)),
          h('button', { type: 'button', class: 'btn-line', onclick: () => go('battles', { battleId: b.id }) }, 'Open battle'));
      })));
  }

  if (!games.length) {
    root.append(h('div', { class: 'empty' }, p.u === ME
      ? 'No finished battles yet. Your battle with @paz.subs is waiting for your round.'
      : 'No finished battles yet.'));
    return root;
  }

  root.append(h('section', { class: 'psec' }, h('h2', {}, 'Rating over time'), ratingChart(p, games),
    h('p', { class: 'small muted' }, 'Dashed line marks the peak rating.')));

  root.append(h('section', { class: 'psec' }, h('h2', {}, `Opponents (${opponents.length})`),
    h('div', { class: 'tablewrap' }, h('table', { class: 'data' },
      h('thead', {}, h('tr', {}, ['Opponent', 'Battles', 'Won', 'Lost', 'Drawn', 'Last met'].map((t, i) => h('th', { scope: 'col', class: i && i < 5 ? 'n' : '' }, t)))),
      h('tbody', {}, opponents.map((o) => h('tr', {},
        h('td', {}, profileLink(o.u)),
        h('td', { class: 'n num' }, o.n), h('td', { class: 'n num up' }, o.W), h('td', { class: 'n num down' }, o.L), h('td', { class: 'n num' }, o.D),
        h('td', {}, `${resultText(o.last)}, ${fmtAgo(o.last.r.date)}`))))))));

  const all = [...games].reverse(), PAGE = 10;
  const tbody = h('tbody');
  const more = h('div');
  const paintHistory = (limit) => {
    tbody.innerHTML = '';
    all.slice(0, limit).forEach((g) => tbody.append(h('tr', {},
      h('td', { style: 'white-space:nowrap' }, fmtDate(g.r.date)),
      h('td', {}, profileLink(g.opp)),
      h('td', { class: g.outcome === 'W' ? 'up' : g.outcome === 'L' ? 'down' : '' }, resultText(g)),
      h('td', { class: 'n num' }, g.r.result === 'forfeit' ? '—' : `${g.mine}–${g.theirs}`),
      h('td', { class: 'n num' }, h('span', { class: g.delta >= 0 ? 'up' : 'down' }, signed(g.delta)), h('span', { class: 'muted' }, ` to ${g.elo}`)))));
    more.innerHTML = '';
    if (limit < all.length) more.append(h('button', { type: 'button', class: 'btn-line', onclick: () => paintHistory(all.length) }, `Show all ${all.length} battles`));
  };
  paintHistory(PAGE);
  root.append(h('section', { class: 'psec' }, h('h2', {}, 'Battle history'),
    h('div', { class: 'tablewrap' }, h('table', { class: 'data' },
      h('thead', {}, h('tr', {}, ['Date', 'Opponent', 'Result', 'Votes', 'Rating change'].map((t, i) => h('th', { scope: 'col', class: i >= 3 ? 'n' : '' }, t)))),
      tbody)), more));
  return root;
}

renderMain();
</script>
</body>
</html>
